name: Gerador de APK Automatico

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'ZEN PLAY'
      package_name:
        description: 'Pacote'
        required: true
        default: 'com.meuplayer.tv'
      mode:
        description: 'Modo'
        required: true
        default: 'webplayer'
      target_url:
        description: 'URL'
        required: true
        default: 'https://webplayer.tvsbr.top'
      orientation:
        description: 'Orientacao da Tela'
        required: false
        default: 'unspecified'
      icon_url:
        description: 'URL do Icone opcional'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar e Assinar APK Direto via Android SDK
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_PKG_NAME: ${{ github.event.inputs.package_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_URL: ${{ github.event.inputs.target_url }}
          INPUT_ORIENTATION: ${{ github.event.inputs.orientation }}
          INPUT_ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM/android.jar"

          PKG_PATH=$(echo "$INPUT_PKG_NAME" | tr '.' '/')
          mkdir -p "src/$PKG_PATH"
          mkdir -p assets
          mkdir -p res/values
          mkdir -p res/drawable
          mkdir -p build/classes

          if [ -f "custom_icon.png" ]; then
            cp custom_icon.png res/drawable/ic_launcher.png
          elif [ -n "$INPUT_ICON_URL" ]; then
            curl -L -s "$INPUT_ICON_URL" -o res/drawable/ic_launcher.png || true
          fi

          ICON_ATTR=""
          if [ -s "res/drawable/ic_launcher.png" ]; then
            ICON_ATTR='android:icon="@drawable/ic_launcher"'
          fi

          ORIENT_VAL="${INPUT_ORIENTATION:-unspecified}"

          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">%s</string>\n</resources>\n' "$INPUT_APP_NAME" > res/values/strings.xml

          printf '{\n  "mode": "%s",\n  "url": "%s"\n}\n' "$INPUT_MODE" "$INPUT_URL" > assets/config.json

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="%s"\n    android:versionCode="1"\n    android:versionName="1.0">\n    <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application\n        android:allowBackup="true"\n        android:label="@string/app_name"\n        %s\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true"\n        android:theme="@android:style/Theme.NoTitleBar.Fullscreen">\n        <activity\n            android:name=".MainActivity"\n            android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation"\n            android:screenOrientation="%s"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' "$INPUT_PKG_NAME" "$ICON_ATTR" "$ORIENT_VAL" > AndroidManifest.xml

          cat << 'EOF' > "src/$PKG_PATH/MainActivity.java"
          package __PACKAGE_NAME__;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  carregarConfiguracao();
              }
              private void carregarConfiguracao() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              InputStream is = getAssets().open("config.json");
                              BufferedReader r = new BufferedReader(new InputStreamReader(is));
                              StringBuilder sb = new StringBuilder();
                              String l;
                              while ((l = r.readLine()) != null) sb.append(l);
                              JSONObject cfg = new JSONObject(sb.toString());
                              String mode = cfg.getString("mode");
                              String targetUrl = cfg.getString("url");
                              if ("dns_panel".equals(mode)) {
                                  try {
                                      HttpURLConnection c = (HttpURLConnection) new URL(targetUrl).openConnection();
                                      c.setConnectTimeout(5000);
                                      BufferedReader ar = new BufferedReader(new InputStreamReader(c.getInputStream()));
                                      String resp = ar.readLine();
                                      if (resp != null && resp.trim().startsWith("{")) {
                                          targetUrl = new JSONObject(resp).optString("dns", targetUrl);
                                      } else if (resp != null && resp.trim().startsWith("http")) {
                                          targetUrl = resp.trim();
                                      }
                                  } catch (Exception ignored) {}
                              }
                              final String finalUrl = targetUrl;
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      webView.loadUrl(finalUrl);
                                  }
                              });
                          } catch (Exception e) { e.printStackTrace(); }
                      }
                  }).start();
              }
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF
          sed -i "s/__PACKAGE_NAME__/$INPUT_PKG_NAME/g" "src/$PKG_PATH/MainActivity.java"

          "$BUILD_TOOLS/aapt2" compile --dir res -o res.zip
          "$BUILD_TOOLS/aapt2" link -I "$ANDROID_JAR" --manifest AndroidManifest.xml -A assets -o unaligned.apk res.zip --java src

          find src -name "*.java" > sources.txt
          javac -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR" -d build/classes @sources.txt
          jar cf classes.jar -C build/classes .
          "$BUILD_TOOLS/d8" classes.jar --lib "$ANDROID_JAR" --output .
          zip -uj unaligned.apk classes.dex

          "$BUILD_TOOLS/zipalign" -p -f 4 unaligned.apk aligned.apk
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=PT"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out Aplicativo-Pronto.apk aligned.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Pronto
          path: Aplicativo-Pronto.apk