name: Gerador de APK Automatico

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'Meu Player TV'
      package_name:
        description: 'Pacote'
        required: true
        default: 'com.meuplayer.tv'
      mode:
        description: 'Modo'
        required: true
        default: 'webplayer'
      target_url:
        description: 'URL'
        required: true
        default: 'https://exemplo.com'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar Estrutura do Projeto Android
        run: |
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/assets

          cat <<EOF > app/src/main/assets/config.json
          {
            "mode": "${{ github.event.inputs.mode }}",
            "url": "${{ github.event.inputs.target_url }}"
          }
          EOF

          echo 'rootProject.name = "TVPlayerApp"' > settings.gradle
          echo 'include ":app"' >> settings.gradle

          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace "${{ github.event.inputs.package_name }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_name }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ github.event.inputs.package_name }}">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/$PKG_PATH/MainActivity.java
          package __PACKAGE_NAME__;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  carregarConfiguracao();
              }
              private void carregarConfiguracao() {
                  new Thread(() -> {
                      try {
                          InputStream is = getAssets().open("config.json");
                          BufferedReader r = new BufferedReader(new InputStreamReader(is));
                          StringBuilder sb = new StringBuilder();
                          String l;
                          while ((l = r.readLine()) != null) sb.append(l);
                          JSONObject cfg = new JSONObject(sb.toString());
                          String mode = cfg.getString("mode");
                          String targetUrl = cfg.getString("url");
                          if ("dns_panel".equals(mode)) {
                              try {
                                  HttpURLConnection c = (HttpURLConnection) new URL(targetUrl).openConnection();
                                  c.setConnectTimeout(5000);
                                  BufferedReader ar = new BufferedReader(new InputStreamReader(c.getInputStream()));
                                  String resp = ar.readLine();
                                  if (resp != null && resp.trim().startsWith("{")) {
                                      targetUrl = new JSONObject(resp).optString("dns", targetUrl);
                                  } else if (resp != null && resp.trim().startsWith("http")) {
                                      targetUrl = resp.trim();
                                  }
                              } catch (Exception ignored) {}
                          }
                          final String finalUrl = targetUrl;
                          runOnUiThread(() -> webView.loadUrl(finalUrl));
                      } catch (Exception e) { e.printStackTrace(); }
                  }).start();
              }
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF
          sed -i "s/__PACKAGE_NAME__/${{ github.event.inputs.package_name }}/g" app/src/main/java/$PKG_PATH/MainActivity.java

      - name: Compilar APK com Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Pronto
          path: app/build/outputs/apk/debug/app-debug.apk
